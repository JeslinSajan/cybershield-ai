name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping CyberShield API Health Endpoint
        run: |
          curl -s -f -m 20 https://cybershield-ai-xnn7.onrender.com/api/v1/health || true
